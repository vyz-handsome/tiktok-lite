name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      # Sidik jari tanda tangan harus SAMA di setiap build, kalau tidak Android menolak update.
      - name: Cek tanda tangan APK
        continue-on-error: true
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "### Build #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: TikTokLike-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # APK juga diunggah ke Release "latest" (langsung .apk, bukan zip) supaya gampang di-download dari HP
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Build #${{ github.run_number }} (versi 1.1.${{ github.run_number }})"
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
